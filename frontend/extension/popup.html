<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 340px; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; padding: 14px; margin: 0; }
    h1 { font-size: 15px; margin: 0 0 2px; }
    .sub { font-size: 11.5px; color: #888; margin-bottom: 12px; }
    .btn { width: 100%; padding: 9px 0; margin: 4px 0; border: none; border-radius: 8px;
           background: #378ADD; color: #fff; font-size: 13px; cursor: pointer; }
    .btn:hover { background: #185FA5; }
    .btn.secondary { background: #eee; color: #333; }
    .btn.danger { background: #F1EFE8; color: #5F5E5A; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .status { font-size: 12px; margin-top: 8px; min-height: 16px; color: #333; white-space: pre-line; }
    .status.ok { color: #1D9E75; }
    .status.err { color: #E24B4A; }
    .stats { font-size: 12px; background: #FAFAF8; border: 1px solid #E8E8E3; border-radius: 8px;
             padding: 10px 12px; margin-top: 8px; display: none; line-height: 1.7; }
    .stats.show { display: block; }
    .stats b { font-weight: 600; }
    .stats .ok-num { color: #1D9E75; }
    .stats .fail-num { color: #E24B4A; }
    .sep { border: none; border-top: 1px solid #E8E8E3; margin: 10px 0; }
    input { width: calc(100% - 16px); padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 12px; margin: 4px 0; }
    label { font-size: 12px; color: #555; }
    .hint { font-size: 11px; color: #1D9E75; background: #E1F5EE; border-radius: 5px; padding: 5px 8px; margin: 4px 0; text-align: center; }
  </style>
</head>
<body>
  <h1>ReCollect 拾遗</h1>
  <div class="sub">收藏激活助手 · 本地采集</div>

  <label>任务 ID（文件名前缀）</label>
  <input id="taskId" type="text" value="xhs_collect" placeholder="如 xhs_20260806" />

  <button id="detailBtn" class="btn">采集当前笔记</button>
  <button id="syncBtn" class="btn">同步当前收藏列表</button>
  <button id="exportBtn" class="btn secondary" disabled>导出文件</button>
  <button id="debugBtn" class="btn danger">反馈开发者（DOM 诊断）</button>

  <div id="stats" class="stats"></div>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
